<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1e2227">
<title>TigridenR</title>
<link rel="stylesheet" href="/vendor/xterm.css">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div id="app">
  <header id="topbar">
    <button id="menu-btn" title="Sessions &amp; files">☰</button>
    <span id="brand">TigridenR</span>
    <span id="session-name"></span>
    <span class="spacer"></span>
    <button id="font-dec" class="font-btn" title="Smaller text">A−</button>
    <span id="font-size" title="Tap to auto-fit">13</span>
    <button id="font-inc" class="font-btn" title="Larger text">A+</button>
    <button id="attach-btn" title="Attach a file to the agent">📎</button>
    <button id="kbd-btn" title="Show keyboard">⌨</button>
    <button id="resync-btn" title="Resync terminal">⟳</button>
    <span id="conn-dot" class="off" title="Connection"></span>
  </header>
  <div id="body">
    <aside id="sidebar">
      <div id="sidebar-head">
        <span>AGENTS</span>
        <button id="changes-btn" title="Show/hide the Changes panel">Changes</button>
      </div>
      <div id="tree"></div>
    </aside>
    <div id="scrim"></div>
    <main id="main">
      <div id="term-wrap"><div id="term"></div></div>
      <div id="overlay" class="hidden"></div>
      <button id="scroll-bottom" class="hidden" title="Jump to the latest output">▼</button>
      <div id="dropzone" class="hidden"><span>Release to attach — the file is copied to the host and its path typed in</span></div>
      <div id="ctxmenu" class="hidden">
        <button data-act="copy">Copy</button>
        <button data-act="paste">Paste</button>
        <button data-act="all">Select All</button>
      </div>
      <input id="file-input" type="file" multiple hidden>
      <div id="confirm" class="hidden">
        <span id="confirm-text"></span>
        <button id="confirm-cancel">Cancel</button>
        <button id="confirm-ok">Close</button>
      </div>
      <div id="file-view" class="hidden">
        <div id="file-head">
          <span id="file-name"></span>
          <button id="file-close" title="Close">✕</button>
        </div>
        <pre id="file-content"></pre>
      </div>
      <footer id="termbar">
        <div id="tabs"></div>
        <button id="new-term" title="New terminal">+</button>
        <button id="close-term" class="hidden" title="Close the active terminal">✕</button>
        <div class="divider"></div>
        <div id="presets"></div>
      </footer>
    </main>
  </div>
</div>
<script src="/vendor/xterm.js"></script>
<script src="/app.js"></script>
</body>
</html>
